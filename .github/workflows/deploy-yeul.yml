name: Deploy yeul

on:
  push:
    branches:
      - yeul

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Production
    runs-on: [self-hosted, yeul]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: yeul

      - name: Build and restart
        run: |
          docker compose up -d --build
          docker image prune -f
