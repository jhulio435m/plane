name: Deploy yeul

on:
  push:
    branches:
      - yeul
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Production
    runs-on: [self-hosted, yeul]

    steps:
      - name: Build and restart
        run: |
          cd /home/yeul/services/plane
          git fetch origin yeul
          git checkout yeul
          git pull origin yeul
          docker compose up -d --build
          docker image prune -f
