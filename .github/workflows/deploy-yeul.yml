name: Deploy yeul

on:
  push:
    branches:
      - yeul

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  ORG: jhulio435m
  TARGET_BRANCH: ${{ github.ref_name }}

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: web
            dockerfile: ./apps/web/Dockerfile.web
            context: .
            image: plane-frontend
          - name: space
            dockerfile: ./apps/space/Dockerfile.space
            context: .
            image: plane-space
          - name: admin
            dockerfile: ./apps/admin/Dockerfile.admin
            context: .
            image: plane-admin
          - name: live
            dockerfile: ./apps/live/Dockerfile.live
            context: .
            image: plane-live
          - name: backend
            dockerfile: ./apps/api/Dockerfile.api
            context: ./apps/api
            image: plane-backend
          - name: proxy
            dockerfile: ./apps/proxy/Dockerfile.ce
            context: ./apps/proxy
            image: plane-proxy

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          dockerfile: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.service.image }}:${{ env.TARGET_BRANCH }}
            ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.service.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-22.04
    needs: [build-and-push]
    if: success()

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            # Update image tags to use our custom images
            export APP_RELEASE=${{ env.TARGET_BRANCH }}
            export REGISTRY=${{ env.REGISTRY }}/${{ env.ORG }}

            # Pull latest images
            docker compose pull

            # Restart all services
            docker compose up -d

            # Clean up old images
            docker image prune -f
